ignoreWorkspaceRootCheck: true
minimumReleaseAge: 0

trustPolicy: no-downgrade
trustPolicyExclude:
  - cached-factory@0.1.0

update:
  ignoreDeps:
    - typescript@7

strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

packages:
  - fixtures/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
  - unrs-resolver

