name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml so a tag only publishes after these checks pass
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `src/typegen.d.ts` is gitignored, generate it before type-aware steps
      - run: pnpm typegen
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm vitest run
      - run: pnpm build
