name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml so a tag only publishes after these checks pass
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Also generates the gitignored `src/typegen.d.ts`. The fixture tests
      # import the package by name, which resolves to `dist/`
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm vitest run
