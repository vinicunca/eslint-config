name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml so a tag only publishes after these checks pass
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    uses: vinicunca/workflows/.github/workflows/unit-test.yml@v1
    with:
      os-matrix: '"ubuntu-latest"'
      node-versions: '22,24'
      # Also generates the gitignored `src/typegen.d.ts` that typecheck needs.
      # The test job always builds first: fixture tests import `dist/`
      build-for-lint: true
