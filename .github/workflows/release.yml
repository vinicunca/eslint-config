name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: sxzz/workflows/.github/workflows/release.yml@v1
    with:
      publish: true
    permissions:
      contents: write
      id-token: write

  notify-docs:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
    steps:
      - name: Request tagged docs import
        if: env.GH_TOKEN != ''
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          jq -n --arg package eslint --arg tag "$RELEASE_TAG" \
            '{event_type: "docs-package-release", client_payload: {package: $package, tag: $tag}}' \
            | gh api repos/vinicunca/docs/dispatches --method POST --input -
