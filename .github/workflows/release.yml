name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # The reusable release workflow only builds and publishes, so gate it here
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    uses: sxzz/workflows/.github/workflows/release.yml@v1
    with:
      publish: true
    permissions:
      contents: write
      id-token: write
